name: UI Tests (Maestro)

# 手动触发为主；等流程稳定后再打开 push 自动跑。
on:
  workflow_dispatch:

concurrency:
  group: uitest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-test:
    name: iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示环境
        run: |
          xcodebuild -version
          java -version 2>&1 | head -3

      - name: 选一台 iPhone 模拟器并启动
        id: sim
        run: |
          UDID=$(python3 - <<'PY'
          import json, re, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          cands = []
          for runtime, devs in data["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for d in devs:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      cands.append((ver, d["name"], d["udid"]))
          if not cands:
              raise SystemExit("没有可用的 iPhone 模拟器")
          cands.sort(reverse=True)
          print(cands[0][2])
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep -i booted

      - name: 编译模拟器版
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoOrganizer.xcodeproj \
            -scheme PhotoOrganizer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 安装并灌入测试照片
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          xcrun simctl install "$UDID" "$APP"

          # 先把照片灌进去，再授权。
          # 顺序反了会出问题：上一轮挂在这里就是这个原因 —— grant 返回 0 但 TCC 没落库，
          # 首页照片计数是 0/0，点「开始扫描」立刻弹系统授权框。
          xcrun simctl addmedia "$UDID" UITestFixtures/*.jpg
          echo "已导入 $(ls UITestFixtures/*.jpg | wc -l) 张测试照片"

          echo "== 预授权相册 =="
          xcrun simctl privacy "$UDID" grant photos com.eddie.photoorganizer
          echo "grant photos rc=$?"
          xcrun simctl privacy "$UDID" grant photos-add com.eddie.photoorganizer
          echo "grant photos-add rc=$?"

      - name: 安装 Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: 预检 - App 到底能不能起来
        if: always()
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p build/preflight

          echo "== 已安装的 App =="
          xcrun simctl listapps "$UDID" 2>/dev/null | grep -i -A3 'photoorganizer' | head -20 || true

          echo "== 用 simctl 直接启动 =="
          xcrun simctl launch "$UDID" com.eddie.photoorganizer 2>&1 | tee build/preflight/launch.txt || true
          sleep 6

          echo "== 截一张当前屏幕 =="
          xcrun simctl io "$UDID" screenshot build/preflight/home.png || true
          ls -l build/preflight/home.png || true

          echo "== App 进程还在不在 =="
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i photoorganizer || echo "(进程列表里没有它 —— 说明启动后就退了)"

          echo "== 崩溃报告 =="
          ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -5 || echo "(没有 .ips)"
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do
            echo "--- $f ---"
            head -50 "$f" || true
          done

          echo "== Maestro 看到的界面元素 =="
          maestro hierarchy > build/preflight/hierarchy.txt 2>&1 || true
          python3 - <<'PY' || true
          import json
          try:
              d = json.load(open('build/preflight/hierarchy.txt', encoding='utf-8'))
          except Exception as e:
              print('层级解析失败：', e)
              raise SystemExit(0)
          out = []
          def walk(n):
              a = n.get('attributes', {})
              t = (a.get('accessibilityText') or '').strip()
              if t:
                  out.append((t, a.get('bounds')))
              for c in n.get('children', []):
                  walk(c)
          walk(d)
          print('有名字的元素：%d 个' % len(out))
          for t, b in out:
              print('  %-42s %s' % (t[:40], b))
          print('-> 首页按钮「开始扫描」在不在层级里：', any('开始扫描' in t for t, _ in out))
          PY

          echo "== 缩略图自检（-PODiag）=="
          xcrun simctl terminate "$UDID" com.eddie.photoorganizer 2>/dev/null || true
          xcrun simctl launch "$UDID" com.eddie.photoorganizer -PODiag || true
          sleep 12
          CONT=$(xcrun simctl get_app_container "$UDID" com.eddie.photoorganizer data 2>/dev/null || true)
          echo "容器：$CONT"
          if [ -n "$CONT" ] && [ -f "$CONT/Documents/po-diag.txt" ]; then
            cp "$CONT/Documents/po-diag.txt" build/preflight/po-diag.txt
            echo "--------------------"
            cat build/preflight/po-diag.txt
            echo "--------------------"
          else
            echo "没生成 po-diag.txt（自检没跑起来）"
          fi

      - name: 跑 UI 用例
        id: test
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          mkdir -p build/maestro-results build/maestro-debug
          set +e
          maestro test \
            --test-output-dir build/maestro-results \
            --debug-output build/maestro-debug \
            --flatten-debug-output \
            --format junit \
            --output build/maestro-report.xml \
            maestro/flows
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Maestro exit code: $CODE"
          # 列一下到底产出了什么，方便排查
          find build/maestro-results -type f | head -50 || true
          find build/maestro-debug -type f | head -50 || true
          find build -maxdepth 1 -name 'maestro-report.xml' -exec ls -l {} \; || true
          # 让这一步自己变红，失败不要藏在后面几步里
          exit $CODE

      - name: 检查「滑过之后图片真的换了」
        if: always()
        run: |
          FIRST=$(find build/maestro-results -name '04_triage_first.png' | head -1)
          SECOND=$(find build/maestro-results -name '05_triage_second.png' | head -1)
          if [ -n "$FIRST" ] && [ -n "$SECOND" ]; then
            echo "对比：$FIRST  →  $SECOND"
            python3 -m venv .venv-shots
            .venv-shots/bin/pip install --quiet pillow
            .venv-shots/bin/python scripts/check_triage_shots.py "$FIRST" "$SECOND"
          else
            echo "没有拿到对比截图，跳过像素校验"
            echo "（说明逐张过那条用例没跑到截图那一步，先看上面的 Maestro 输出）"
            find build/maestro-results -type f | head -50 || true
          fi

      - name: 上传报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            build/maestro-report.xml
            build/maestro-results
            build/maestro-debug
            build/preflight
          retention-days: 14

      - name: 结果汇总
        if: always()
        run: |
          echo "Maestro exit: ${{ steps.test.outputs.exit_code }}"
          if [ -f build/maestro-report.xml ]; then
            echo "--- junit 摘要 ---"
            grep -o '<testsuite [^>]*' build/maestro-report.xml | head -5 || true
            grep -c '<testcase' build/maestro-report.xml || true
          else
            echo "没有生成 junit 报告（Maestro 可能根本没跑起来，或参数仍不对）"
          fi
          echo "结论：exit=${{ steps.test.outputs.exit_code }}（0 = 全通过）"
