appId: com.eddie.photoorganizer
name: 07 模糊页：三档灵敏度
---
- runFlow: ../subflows/open_large.yaml

- tapOn: "模糊 .*"

# 模糊页特有的判定条
- assertVisible: "模糊判定"
- assertVisible: "宽松"
- assertVisible: "标准"
- assertVisible: "严格"
- takeScreenshot: 11_blur_default

# 三档来回切，每档都不能崩、判定条要一直在
- tapOn: "宽松"
- assertVisible: "模糊判定"
- takeScreenshot: 12_blur_loose

- tapOn: "标准"
- assertVisible: "模糊判定"

- tapOn: "严格"
- assertVisible: "模糊判定"
- takeScreenshot: 13_blur_strict

# 切回普通分类，判定条要消失
- tapOn: "建议清理 [0-9]+"
- assertNotVisible: "模糊判定"
