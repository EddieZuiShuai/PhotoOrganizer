appId: com.eddie.photoorganizer
name: 06 布局三档切换 + 分组页隐藏布局按钮
---
- runFlow: ../subflows/open_large.yaml

# 单列（子流程落地时已经切好）：列表顶部有「按体积从大到小」
- assertVisible: "按体积从大到小.*"

# 换成两列 / 三列：变成格子，那行说明消失，格子仍在
- tapOn: "两列"
- assertNotVisible: "按体积从大到小.*"
- assertVisible: "照片 .*"

- takeScreenshot: 09_layout_two

- tapOn: "三列"
- assertNotVisible: "按体积从大到小.*"
- assertVisible: "照片 .*"


# 布局选择会记住：切成单列 → 冷启动 → 回到大文件页，应该还是单列
- tapOn: "单列"
- runFlow: ../subflows/scan.yaml
- tapOn: "空间"
- tapOn: "去看大文件.*"
- extendedWaitUntil:
    visible: "按体积从大到小.*"
    timeout: 12000
- takeScreenshot: 10_layout_remembered

# 分组页（重复 / 相似）不应该出现布局按钮
- tapOn: "重复 [0-9]+"
- assertNotVisible: "单列"
- assertNotVisible: "两列"
- assertNotVisible: "三列"
