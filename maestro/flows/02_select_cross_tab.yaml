appId: com.eddie.photoorganizer
name: 02 选中与跨分类保留
---
- runFlow: ../subflows/open_large.yaml

# 回到三列网格：单列的行没有「照片 xx」这个无障碍标签
- tapOn: "三列"
- tapOn:
    text: "照片 .*"
    index: 0
- assertVisible: "已选 1 张.*"

# 切到「建议清理」再切回来，选中不能丢
- tapOn: "建议清理.*"
- assertVisible: "已选 1 张.*"
- tapOn: "大文件.*"
- assertVisible: "已选 1 张.*"

# 再选第二张，计数变 2
- tapOn:
    text: "照片 .*"
    index: 1
- assertVisible: "已选 2 张.*"
- takeScreenshot: 03_cross_tab

# 再点第一张取消，只剩 1
- tapOn:
    text: "照片 .*"
    index: 0
- assertVisible: "已选 1 张.*"

# 收尾：取消勾选，别把状态留给下一条
- tapOn: "取消"
- assertVisible: "点一下选中.*"
