appId: com.eddie.photoorganizer
name: 02 选中与跨分类保留
---
- runFlow: ../subflows/open_large.yaml

# 回到三列网格：单列的行没有「照片 xx」这个无障碍标签
- tapOn: "三列"
- tapOn:
    text: "照片 .*"
    index: 0
- assertVisible: "已选 1 张.*"

# 切到「重复」再切回大文件，选中不能丢。
# 注意这里必须用「重复 [0-9]+」：页面上另有一个汇总标题叫「重复组」，
# 写成「重复.*」会先命中那个标题，点了没反应。
- tapOn: "重复 [0-9]+"
- assertVisible: "已选 1 张.*"

# 大文件这个标签在 iPhone SE 上被挤到屏幕外，只能从空间看板回去。
# build 20 起「空间」是底部 tab。
- tapOn:
    id: "tab-space"
- tapOn: "去看大文件.*"
- assertVisible: "已选 1 张.*"

# 再选第二张，计数变 2
- tapOn:
    text: "照片 .*"
    index: 1
- assertVisible: "已选 2 张.*"
- takeScreenshot: 03_cross_tab

# 再点第一张取消，只剩 1
- tapOn:
    text: "照片 .*"
    index: 0
- assertVisible: "已选 1 张.*"

# 收尾：取消勾选，别把状态留给下一条
- tapOn:
    id: "action-clear-selection"
- assertVisible: "点一下选中.*"
