appId: com.eddie.photoorganizer
name: 00 首启联网说明
---
# ⚠️ 这条用例**不能**依赖「自己第一个跑」。
# `maestro test <目录>` 不按文件名排序（实测 11 条的完成顺序是
# 04/08/06/09/01/07/00/10/05/02/03）。等 00 跑到时，别的 flow 很可能已经
# 用 scan.yaml 里的 optional 点击把弹窗关掉、把 cloudNoticeSeenVersion 写上了。
# 所以这里用启动参数 -ForceCloudNotice 强制弹一次（App 里只有 DEBUG 才认）。
- launchApp:
    arguments:
      "-ForceCloudNotice": "1"

# 卡片必须自己说清楚三件事：下载不是上传、整理不用先下载、识别在本机
- assertVisible: "为什么需要联网？"
- assertVisible: "只为了从 iCloud 取回照片，不是上传"
- assertVisible: "下载，不是上传"
- assertVisible: "整理不用先下载"
- assertVisible: "识别全在这台手机上"
- assertVisible: "断网也能用.*"
- takeScreenshot: 13_cloud_notice

# 点「我知道了」才关；关掉后要能看到首页（用首屏标题断言，
# 「开始扫描」在 iPhone SE 上掉在首屏之外，断它会在小屏机器上假失败）
- tapOn:
    id: "cloud-notice-ok"
- assertNotVisible: "为什么需要联网？"
- assertVisible: "先在手机上把相册理清楚"

# 再冷启动一次（这次不带参数）：看过之后不该重复打扰
- launchApp
- assertNotVisible: "为什么需要联网？"
- assertVisible: "先在手机上把相册理清楚"
