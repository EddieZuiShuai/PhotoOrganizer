appId: com.eddie.photoorganizer
name: 05 全选 / 取消全选 / 清空
---
- runFlow: ../subflows/scan.yaml

- tapOn: "大文件.*"
- tapOn: "三列"

# 全选：12 张测试图应该一次全勾上
- tapOn: "全选 12"
- assertVisible: "已选 12 张.*"
- assertVisible: "删除 12 张"
- takeScreenshot: 08_select_all

# 取消全选：计数归零，底部回到「重新扫描 / 导出清单」
- tapOn: "取消全选"
- assertNotVisible: "已选 12 张.*"
- assertVisible: "重新扫描"
- assertVisible: "导出清单"

# 只选两张，再用「清空」按钮一次性归零
- tapOn:
    text: "照片 .*"
    index: 0
- tapOn:
    text: "照片 .*"
    index: 1
- assertVisible: "已选 2 张.*"
- tapOn: "清空"
- assertVisible: "点一下选中.*"
