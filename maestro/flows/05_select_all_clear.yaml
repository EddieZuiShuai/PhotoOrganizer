appId: com.eddie.photoorganizer
name: 05 全选 / 取消全选 / 清空
---
- runFlow: ../subflows/open_large.yaml
- tapOn: "三列"

# 全选：按钮上就是这个分类的总张数
- tapOn: "全选 [0-9]+"
- assertVisible: "已选 [0-9]+ 张.*"
- assertVisible: "删除 [0-9]+ 张"
- takeScreenshot: 08_select_all

# 取消全选：计数归零，底部回到「重新扫描 / 导出清单」
- tapOn: "取消全选"
- assertNotVisible: "已选 [0-9]+ 张.*"
- assertVisible: "重新扫描"
- assertVisible: "导出清单"

# 只选两张，再用顶部的「取消选中 N 张」一次性归零
# （原来这里只有一个「清空」小字，2026-11-05 改成了带数量的按钮）
- tapOn:
    text: "照片 .*"
    index: 0
- tapOn:
    text: "照片 .*"
    index: 1
- assertVisible: "已选 2 张.*"
- tapOn: "取消选中 2 张"
- assertVisible: "点一下选中.*"
- assertVisible: "重新扫描"
