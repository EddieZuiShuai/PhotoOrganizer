appId: com.eddie.photoorganizer
name: 03 逐张过：首滑、连划、撤销
---
- runFlow: ../subflows/open_large.yaml
- tapOn: "三列"

- tapOn: "逐张过"
- assertVisible: "左滑删 · 右滑留"
# 张数取决于相册里有多少照片，这里只断言「停在第 1 张」
- assertVisible: "1 / [0-9]+"
- waitForAnimationToEnd
- takeScreenshot: 04_triage_first

# v1.4 的主修复：第一下滑出去，卡片里的图要跟着换
- swipe:
    start: "85%,55%"
    end: "15%,55%"
    duration: 400
- assertVisible: "2 / [0-9]+"
- takeScreenshot: 05_triage_second

# 撤销：回到第 1 张，且不留标记
- tapOn:
    id: "triage-undo"
- assertVisible: "1 / [0-9]+"
- assertNotVisible: "已标 [0-9]+"

# 按钮删除 → 标记计数 +1
- tapOn:
    id: "triage-delete"
- assertVisible: "2 / [0-9]+"
- assertVisible: "已标 1"

# 按钮保留 → 继续前进，标记数不变
- tapOn:
    id: "triage-keep"
- assertVisible: "3 / [0-9]+"
- assertVisible: "已标 1"

# 再撤销一次，回到第 2 张
- tapOn:
    id: "triage-undo"
- assertVisible: "2 / [0-9]+"

# 关掉逐张过，标记要带回列表
- tapOn: "关闭逐张过"
- extendedWaitUntil:
    visible: "已选 1 张.*"
    timeout: 10000
- tapOn: "取消选中 [0-9]+ 张"
