appId: com.eddie.photoorganizer
name: 03 逐张过：首滑、连划、撤销
---
- runFlow: ../subflows/open_large.yaml
- tapOn: "三列"

- tapOn: "逐张过"

# 1.5(26) 起逐张过会记住「看到哪」，本 flow 跑之前别的用例可能已经判过几张。
# 有进度就先「从头再筛」，否则下面「1 / N」的断言没有确定答案。
# 顺带把「重来」这条路径也覆盖掉。
- runFlow:
    when:
      visible:
        id: "triage-reset"
    commands:
      - tapOn:
          id: "triage-reset"
      - tapOn: "从头开始"

- assertVisible: "左滑待删 · 右滑保留"
# 张数取决于相册里有多少照片，这里只断言「停在第 1 张」
- assertVisible: "1 / [0-9]+"
- waitForAnimationToEnd
- takeScreenshot: 04_triage_first

# v1.4 的主修复：第一下滑出去，卡片里的图要跟着换
- swipe:
    start: "85%,55%"
    end: "15%,55%"
    duration: 400
- assertVisible: "2 / [0-9]+"
- takeScreenshot: 05_triage_second

# 撤销：回到第 1 张，且不留标记
- tapOn:
    id: "triage-undo"
- assertVisible: "1 / [0-9]+"
- assertNotVisible: "待删 [0-9]+"

# 「待删」按钮 → 计数 +1（build 20 从「删除」改名；1.5 起叫「待删」，批量删在另一个按钮）
- tapOn:
    id: "triage-mark"
- assertVisible: "2 / [0-9]+"
- assertVisible: "待删 1"

# 按钮保留 → 继续前进，标记数不变
- tapOn:
    id: "triage-keep"
- assertVisible: "3 / [0-9]+"
- assertVisible: "待删 1"

# 再撤销一次，回到第 2 张
- tapOn:
    id: "triage-undo"
- assertVisible: "2 / [0-9]+"

# 关掉逐张过，标记要带回列表
- tapOn: "关闭逐张过"
- extendedWaitUntil:
    visible: "已选 1 张.*"
    timeout: 10000
- tapOn:
    id: "action-clear-selection"
