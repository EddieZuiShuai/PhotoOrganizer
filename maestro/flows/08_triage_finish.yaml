appId: com.eddie.photoorganizer
name: 08 逐张过：连续划到结算页并带回标记
---
- runFlow: ../subflows/scan.yaml

- tapOn: "大文件.*"
- tapOn: "逐张过"
- assertVisible: "1 / 12"

# 连点「删除」12 次走完全部。每点一次都确认计数器前进了，
# 这样万一某一下被 busy 锁吞掉，失败会停在准确的位置，而不是最后才报错。
- tapOn:
    id: "triage-delete"
- assertVisible: "2 / 12"
- tapOn:
    id: "triage-delete"
- assertVisible: "3 / 12"
- tapOn:
    id: "triage-delete"
- assertVisible: "4 / 12"
- tapOn:
    id: "triage-delete"
- assertVisible: "5 / 12"
- tapOn:
    id: "triage-delete"
- assertVisible: "6 / 12"
- takeScreenshot: 13_triage_mid

- tapOn:
    id: "triage-delete"
- assertVisible: "7 / 12"
- tapOn:
    id: "triage-delete"
- assertVisible: "8 / 12"
- tapOn:
    id: "triage-delete"
- assertVisible: "9 / 12"
- tapOn:
    id: "triage-delete"
- assertVisible: "10 / 12"
- tapOn:
    id: "triage-delete"
- assertVisible: "11 / 12"
- tapOn:
    id: "triage-delete"
- assertVisible: "12 / 12"
- tapOn:
    id: "triage-delete"

# 结算页：条数、可释放空间、以及「标记只是暂存」的提示
- extendedWaitUntil:
    visible: "这一批过完了"
    timeout: 15000
- assertVisible: "看了 12 张 · 标记删除 12 张"
- assertVisible: "预计可释放.*"
- assertVisible: "标记只是暂存.*"
- takeScreenshot: 14_triage_summary

# 完成 → 回到列表，12 张全部带回为已勾选
- tapOn:
    id: "triage-finish"
- extendedWaitUntil:
    visible: "已选 12 张.*"
    timeout: 10000
- assertVisible: "删除 12 张"
- takeScreenshot: 15_triage_back

# 收尾：取消勾选，不真的删
- tapOn: "取消"
- assertVisible: "点一下选中.*"
