appId: com.eddie.photoorganizer
name: 08 逐张过：连续标记后关掉，标记要带回列表
---
- runFlow: ../subflows/open_large.yaml
- tapOn: "三列"

- tapOn: "逐张过"
- assertVisible: "1 / [0-9]+"

# 连划四张：删、删、留、留 —— 每划一次都确认计数器真的前进了。
# 这样万一某一下被 busy 锁吞掉，失败会停在准确的位置。
- tapOn:
    id: "triage-mark"
- assertVisible: "2 / [0-9]+"
- tapOn:
    id: "triage-mark"
- assertVisible: "3 / [0-9]+"
- assertVisible: "待删 2"
- takeScreenshot: 14_triage_mid
- tapOn:
    id: "triage-keep"
- assertVisible: "4 / [0-9]+"
- assertVisible: "待删 2"
- tapOn:
    id: "triage-keep"
- assertVisible: "5 / [0-9]+"

# 中途关掉：标记不能丢，要带回列表变成勾选
- tapOn: "关闭逐张过"
- extendedWaitUntil:
    visible: "已选 2 张.*"
    timeout: 10000
- assertVisible: "删除 2 张"
- takeScreenshot: 15_triage_back

# 收尾：取消勾选，不真的删
- tapOn:
    id: "action-clear-selection"
- assertVisible: "点一下选中.*"
